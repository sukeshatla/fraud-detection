spring:
  application:
    name: alert-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud-local-only}
    hikari:
      schema: alerts
      maximum-pool-size: 10
      connection-timeout: 2000
  flyway:
    schemas: alerts
    default-schema: alerts
  jpa:
    open-in-view: false            # OSIV hides N+1 (lazy loads during JSON rendering) and pins a connection per request
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: alerts
      auto-offset-reset: earliest
      isolation-level: read-committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      concurrency: 2
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

fraud:
  alerts:
    lock-ttl: 5s
    publish-timeout: 5s
