spring:
  application:
    name: alert-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud-local-only}
    hikari:
      schema: alerts
      maximum-pool-size: 10
      connection-timeout: 2000
      data-source-properties:
        options: "-c statement_timeout=5000"
  flyway:
    schemas: alerts
    default-schema: alerts
  jpa:
    open-in-view: false            # OSIV hides N+1 (lazy loads during JSON rendering) and pins a connection per request
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true     # producer spans + traceparent header on every record
    consumer:
      group-id: alerts
      auto-offset-reset: earliest
      isolation-level: read-committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      observation-enabled: true     # consumer spans continue the trace started by the HTTP request upstream
      concurrency: 2
    producer:
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true          # histogram buckets → p95/p99 computed in Prometheus
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}   # 10% of requests traced by default
  # Span export is OFF unless MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set
  # (compose points it at Jaeger). An empty value would count as "configured" and fail startup.

fraud:
  alerts:
    lock-ttl: 5s
    publish-timeout: 5s
