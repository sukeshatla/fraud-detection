spring:
  application:
    name: scoring-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # bound graceful shutdown (in-flight batch + outbox drain)
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud-local-only}
    hikari:
      schema: scoring                 # search_path: this service only sees its own schema
      # Pool sizing ≈ cores × 2 (+ effective spindles). Throwing more connections at Postgres
      # adds lock/context-switch contention, not throughput. Virtual threads do NOT change this.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 2000      # fail fast instead of queueing forever
      data-source-properties:
        options: "-c statement_timeout=5000"   # no query may run longer than 5 s
        reWriteBatchedInserts: true # driver turns N single-row INSERTs into multi-row VALUES
  flyway:
    schemas: scoring                # created if missing; migrations in db/migration
    default-schema: scoring
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/fraud}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/fraud/protocol/openid-connect/certs}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true     # producer spans + traceparent header on every record
    consumer:
      group-id: scoring
      auto-offset-reset: earliest     # a new consumer group starts from the beginning: never skip transactions
      max-poll-records: 500
      isolation-level: read-committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor  # incremental rebalances
    listener:
      observation-enabled: true       # consumer spans continue the producer's trace (record listeners)
      concurrency: 3                  # consumer threads per instance; total across instances ≤ partitions
      ack-mode: batch                 # commit after the whole poll batch was processed successfully
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true          # histogram buckets → p95/p99 computed in Prometheus
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}   # 10% of requests traced by default
  # Span export is OFF unless MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set
  # (compose points it at Jaeger). An empty value would count as "configured" and fail startup.

fraud:
  scoring:
    publish-timeout: 5s           # outbox relay waits at most this long for Kafka acks
    max-concurrent-accounts: 64   # accounts scored in parallel per poll (virtual threads, Semaphore-bounded)
    rules:
      high-amount-usd: 5000
      usd-rates:
        EUR: 1.08
        GBP: 1.27
        JPY: 0.0067
        INR: 0.012
      velocity-max-per-minute: 5
      geo-velocity-window: 1h
      high-risk-mccs: 7995, 6051, 4829, 6211   # gambling, quasi-cash, money transfer, securities/crypto brokers
      card-testing-amount: 2.00
      card-testing-min-count: 3
    risk-cache:
      flag-window: 24h      # a DECLINE keeps the account high-risk this long
      ttl: 1h               # ± jitter, so keys written together don't expire together
      clear-ttl: 5m         # negative caching for clean accounts
      jitter: 0.10
      lock-ttl: 2s
      lock-wait: 300ms
    ml:
      enabled: true
      model: classpath:ml/model-v1.json   # produced by ml/train.py
      rule-weight: 0.6                    # final = max(rule, 0.6·rule + 0.4·100p)
      max-concurrent: 32                  # Semaphore bulkhead permits
      acquire-timeout: 20ms               # then fall back to rules-only
