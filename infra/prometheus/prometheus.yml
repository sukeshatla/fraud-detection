# Scrapes every replica of every service: Docker DNS returns one A record per replica.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: [ingestion-service], type: A, port: 8081, refresh_interval: 10s }]
  - job_name: scoring-service
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: [scoring-service], type: A, port: 8082, refresh_interval: 10s }]
  - job_name: alert-service
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: [alert-service], type: A, port: 8083, refresh_interval: 10s }]
