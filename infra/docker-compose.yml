# Local platform.
#   docker compose -f infra/docker-compose.yml up -d                       # infrastructure only (run services from the IDE)
#   ./mvnw -DskipTests package && \
#   docker compose -f infra/docker-compose.yml --profile app up -d --build  # + 3×ingestion, 3×scoring, 2×alerts, NGINX on :8080
#   docker compose -f infra/docker-compose.yml --profile tools up -d       # + Kafka UI on :8090
name: fraud-platform

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (no ZooKeeper — removed in Kafka 4.0)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared explicitly with the right partition count
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: fraud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: fraud-kafka-ui
    profiles: ["tools"]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---- Application (profile "app") -------------------------------------------------------------
  # Replicated services have no container_name/ports: NGINX reaches them via Docker DNS.

  ingestion-service:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { MODULE: ingestion-service } }
    deploy: { replicas: 3 }
    environment:
      <<: &app-env
        KAFKA_BOOTSTRAP_SERVERS: kafka:29092
        REDIS_HOST: redis
        DB_URL: jdbc:postgresql://postgres:5432/fraud
        DB_PASSWORD: ${POSTGRES_PASSWORD:-fraud-local-only}
      SERVER_PORT: "8081"
    healthcheck: &readiness
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on: &infra
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  scoring-service:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { MODULE: scoring-service } }
    deploy: { replicas: 3 }     # 3 instances × 3 listener threads = 9 consumers ≤ 12 partitions
    environment:
      <<: *app-env
      SERVER_PORT: "8082"
    healthcheck: *readiness
    depends_on: *infra

  alert-service:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { MODULE: alert-service } }
    deploy: { replicas: 2 }
    environment:
      <<: *app-env
      SERVER_PORT: "8083"
    healthcheck: *readiness
    depends_on: *infra

  gateway:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/nginx/Dockerfile }
    container_name: fraud-gateway
    ports:
      - "8080:80"
    depends_on:
      ingestion-service: { condition: service_healthy }
      scoring-service: { condition: service_healthy }
      alert-service: { condition: service_healthy }

volumes:
  pgdata:
