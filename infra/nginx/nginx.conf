# Edge for the whole platform: L7 load balancing, health-aware failover, SSE pass-through,
# request ids, a coarse per-IP rate limit, and the dashboard's static files.
worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    server_tokens off;

    # Docker's embedded DNS. "resolve" below re-resolves service names, so scaled-up or restarted
    # replicas (new IPs) join the pool without an NGINX reload (open-source NGINX ≥ 1.27.3).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Keep the client's X-Request-Id, or mint one; forwarded upstream and logged on both sides.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format edge '$remote_addr "$request" $status ${request_time}s '
                    'upstream=$upstream_addr upstream_time=${upstream_response_time}s rid=$req_id';
    access_log /var/log/nginx/access.log edge;

    # Coarse edge protection per client IP (layer 1). Per-client business quotas live in
    # ingestion-service on Redis (layer 2, Feature 002).
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=2000r/s;
    limit_req_status 429;

    # Ingestion: least_conn, because request times vary (Kafka ack waits) and round-robin would
    # pile requests on a momentarily slow instance.
    upstream ingestion {
        zone ingestion 64k;
        least_conn;
        server ingestion-service:8081 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Alerts: round-robin; SSE connections are long-lived and spread at connect time.
    upstream alerts {
        zone alerts 64k;
        server alert-service:8083 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream scoring {
        zone scoring 64k;
        server scoring-service:8082 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;

        proxy_http_version 1.1;              # upstream keep-alive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Request-Id $req_id always;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        location /api/v1/transactions {
            limit_req zone=per_ip burst=4000 nodelay;
            proxy_pass http://ingestion;
            # Passive health check + retry on another instance. POST is normally NOT retried
            # (non-idempotent); it is safe here because clients send Idempotency-Key and the
            # pipeline dedupes on transactionId (Feature 002/004).
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        # Server-Sent Events: no buffering, long read timeout, HTTP/1.1 keep-alive.
        location = /api/v1/alerts/stream {
            proxy_pass http://alerts;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/v1/alerts {
            proxy_pass http://alerts;
            proxy_next_upstream error timeout http_502 http_503;  # GET/PATCH: PATCH carries a version → safe
        }

        location /api/v1/accounts {
            proxy_pass http://scoring;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Operator endpoints are not exposed at the edge (Feature 015 adds auth for them).
        location /admin/   { return 404; }
        location /actuator { return 404; }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;   # SPA routing
        }
    }
}
