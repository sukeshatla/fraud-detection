spring:
  application:
    name: ingestion-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # bound graceful shutdown
  threads:
    virtual:
      enabled: true          # Tomcat request handling on virtual threads (ADR-0004)
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by Keycloak behind the gateway (one public issuer for browsers and machines);
          # signing keys are fetched over the internal network.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/fraud}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/fraud/protocol/openid-connect/certs}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms           # fail fast → limiter fails open instead of stalling requests
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true     # producer spans + traceparent header on every record
    producer:
      acks: all              # wait for all in-sync replicas → no loss on leader failover
      compression-type: lz4
      properties:
        enable.idempotence: true         # broker dedupes producer retries (PID + sequence)
        max.in.flight.requests.per.connection: 5   # ≤5 keeps ordering with idempotence
        linger.ms: 5                     # tiny batching window: throughput ↑, latency ≈ same
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000        # ≥ linger.ms + request.timeout.ms; bounds internal retries

server:
  port: 8081
  shutdown: graceful         # finish in-flight requests on SIGTERM

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true          # histogram buckets → p95/p99 computed in Prometheus
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}   # 10% of requests traced by default
  # Span export is OFF unless MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set
  # (compose points it at Jaeger). An empty value would count as "configured" and fail startup.        # /actuator/health/liveness and /readiness for LB + k8s

fraud:
  ingestion:
    topic: transactions.received.v1
    partitions: 12
    replication-factor: 1
    publish-timeout: 5s
    max-clock-skew: 5m
    rate-limit:
      enabled: true
      default-quota:
        capacity: 200            # burst
        refill-per-second: 100   # sustained rps per client
      clients:
        gw-premium:
          capacity: 2000
          refill-per-second: 1000
    idempotency:
      ttl: 24h
