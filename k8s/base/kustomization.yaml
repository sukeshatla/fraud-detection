apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud
resources:
  - namespace.yaml
  - config.yaml
  - infra.yaml
  - keycloak.yaml
  - ingestion-service.yaml
  - scoring-service.yaml
  - alert-service.yaml
  - gateway.yaml
configMapGenerator:
  # Identical copy of infra/keycloak/fraud-realm.json (kustomize can't read outside its root; CI diffs them).
  - name: keycloak-realm
    files: [keycloak/fraud-realm.json]
