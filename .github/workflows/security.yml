name: Security

# Supply-chain and secret scanning (AC-014-04, AC-015-06). Fails on HIGH/CRITICAL findings that
# have a fix available, so the gate stays actionable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"   # weekly: new CVEs appear without code changes

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip=true compile
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true      # only findings we can act on
          exit-code: '1'
          format: table

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" mirror.gcr.io/zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose
