name: Nightly load smoke

# AC-013-07: boot the full replicated stack and run a short Gatling simulation against it.
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Every image pull (compose services AND Dockerfile base images) goes through Google's public
      # Docker Hub mirror: shared runner IPs hit Docker Hub's anonymous rate limit.
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Start the platform (3×ingestion, 3×scoring, 2×alerts, NGINX) and run the e2e smoke test
        run: infra/smoke-test.sh

      - name: Gatling smoke simulation (SLO assertions fail the job)
        run: ./mvnw -B -ntp -pl load-tests gatling:test -Dgatling.simulationClass=com.fraudplatform.load.SmokeSimulation

      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report
          path: load-tests/target/gatling/

      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail=200
