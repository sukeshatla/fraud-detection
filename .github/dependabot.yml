# AC-014-04: dependency updates arrive as small, reviewable PRs, grouped to limit noise.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring: { patterns: ["org.springframework*", "io.micrometer*", "io.opentelemetry*"] }
      testing: { patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "org.mockito*", "com.tngtech.archunit*"] }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      react: { patterns: ["react", "react-dom", "@types/react*"] }
      tooling: { patterns: ["vite", "vitest", "eslint*", "typescript*", "@vitejs/*", "prettier"] }
    ignore:
      # TypeScript 7 (native compiler) is blocked until typescript-eslint accepts it as a peer.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/infra/docker", "/infra/nginx"]
    schedule: { interval: weekly }
    ignore:
      # The runtime JRE tracks the Java LTS the code is compiled and tested on (ADR-0004);
      # moving to the next LTS is a deliberate change of toolchain, CI JDK and image together.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      # Build-stage Node follows LTS (even) releases only; odd majors are short-lived "Current".
      - dependency-name: node
        update-types: ["version-update:semver-major"]
